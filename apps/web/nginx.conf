# apps/web 生产 nginx 配置
# - 静态托管 vite 构建产物（SPA，fallback 到 index.html）
# - /api/* 反向代理到 docker-compose 网络内的 server 服务（容器名即主机名）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 课件 JSON 含 base64 图片，AI 生成耗时较长，放大 body 与超时限制
    client_max_body_size 50m;

    location /api/ {
        # 不带尾斜杠的 proxy_pass 保留完整 URI：/api/xxx -> http://server:3001/api/xxx
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 生成接口可能超过 3 分钟（server 端 timeout 600s）
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
